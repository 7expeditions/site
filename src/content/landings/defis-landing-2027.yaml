- type: day
  d: День на воде
  w: Типичный день рыбалки
  paras:
  - Автобус уходит от лоджа чуть раньше 7:00. До причала 20–30 минут, по плохой дороге дольше. К 7:30 все лодки на воде.
  - Ловим до 16:00, иногда время сдвигают под прилив. В 16:30–16:45 автобус привозит нас обратно в лодж. Еду в лодже готовит свой повар, она входит в проживание.
  stay: <b>Ночь.</b> Arnhem Land Barramundi Lodge
