- type: why
  title: Почему именно сюда
  items:
  - h: Время
    html: 'Лодж принимает рыболовов <b>только в два окна</b>: март и апрель, потом октябрь и ноябрь. Весеннее окно идёт с марта минимум до конца апреля. Мы едем в апреле 2027. Точные даты пока не назначены.'
  - h: Доступ
    html: Арнем-Ленд это земля аборигенов. Въезд только <b>по разрешениям традиционных владельцев земли</b>. Разрешения на рыбалку для нас оформляет лодж. Другого рыболовного оператора в этом районе нет.
  - h: Рыба
    html: 'Ловим барамунди в реках Liverpool, Tomkinson, Mann и Goomadeer, а ещё в прибрежных протоках и устьях рек. У лоджа есть свой <b>Metre Club</b>: список рыб от 100 см, пойманных здесь с 2005 по 2026 год. Барамунди длиннее 80 см гиды отпускают, это производители.'
  - h: Лодж
    html: 'Живём в <a href="https://barralodge.com.au/the-lodge/" target="_blank" rel="noopener">Arnhem Land Barramundi Lodge</a>, в 20 км от Манингриды. В лодже <b>12 сафари-сьютов</b>: кондиционер, большая веранда, кровати ставят как двуспальную или две раздельные. Всё питание входит в проживание, готовит свой повар.'
  - h: Безопасность
    html: До Дарвина 300 км, до Манингриды 20 км. В районе лоджа <b>мобильной связи нет</b>, сеть Telstra есть в Манингриде. В главном здании лоджа работает интернет Starlink.
  - h: Логистика
    html: От Дарвина до Манингриды 300 км, <b>около часа</b> рейсом Airnorth, он летает ежедневно. Лимит багажа на рейсе 15 кг. От лоджа до причала автобус идёт 20–30 минут. У лоджа восемь лодок OceanMaster.
