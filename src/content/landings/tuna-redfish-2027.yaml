    src: /expeditions/tuna-redfish-2027/img/tarpon.jpg
    m: /expeditions/tuna-redfish-2027/img/m/tarpon.jpg
    pos: 50% 50%
  mods:
  - portrait
- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/tarpon-2.jpg
    m: /expeditions/tuna-redfish-2027/img/m/tarpon-2.jpg
    pos: 50% 50%
  mods:
  - portrait
  - fit
- type: day
  paras:
  - >-
    Приливы Golden Isles — самые высокие на всём побережье, до 10 футов. На этой неделе новолуние: вода поднимается на восемь футов и заливает траву. Рыба заходит в марш, и её видно по спине и хвосту над водой.
- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/floodtide.jpg
    m: /expeditions/tuna-redfish-2027/img/m/floodtide.jpg
    pos: 70% 60%
- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/poling.jpg
    m: /expeditions/tuna-redfish-2027/img/m/poling.jpg
    pos: 30% 50%
  mods:
  - fit
- type: day
  paras:
  - >-
    Четыре дня ловим быков на нерестовом ходу и тарпона. На высокой воде — редфиша в траве, с шеста, по хвостам. Утро — быки, вечер — прилив.
- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/redfish-2.jpg
    m: /expeditions/tuna-redfish-2027/img/m/redfish-2.jpg
    pos: 50% 50%
  mods:
  - portrait
  - fit
- type: day
  paras:
  - >-
    Лодки: бэй-боты на 2–3 рыболова для быков и тарпона, скифы по двое для травы. Уходим с причала яхт-клуба курорта.
- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/release.jpg
    m: /expeditions/tuna-redfish-2027/img/m/release.jpg
    pos: 50% 50%
  mods:
  - portrait
- type: day
  paras:
  - Вся крупная рыба отпускается в воде.
