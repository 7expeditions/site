- type: photo
  pic:
    src: /expeditions/tuna-redfish-2027/img/marsh.jpg
    m: /expeditions/tuna-redfish-2027/img/m/marsh.jpg
    pos: 55% 60%
- type: day
  compact: true
  d: 29 сентября, среда
  w: Brunswick / Jacksonville
  paras:
  - >-
    Вылет по своим маршрутам: из Brunswick чартером или из Jacksonville регулярными рейсами в Бостон и Нью-Йорк.
- type: notes
  title: Трансферы
  paras:
  - Boston, MA → Chatham, MA · 150 км, авто или чартер.
  - Chatham, MA → Brunswick, GA · чартер, 2 часа 30 мин.
  - >-
    Brunswick, GA → Boston, MA или New York, NY · чартер; или Jacksonville, FL (1 час 15 мин на авто) → регулярные рейсы, 2 часа 30 мин.
