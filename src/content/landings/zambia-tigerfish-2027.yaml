    Рыбаки: дальний выход вниз к границе парка, полный день с обедом на острове; здесь самые старые тигры.
  - >-
    Для тех, кто не хочет больше ловить: утром вертолётный облёт горного уступа над Замбези и долины Мана&#8209;Пулс (4 человека на рейс), после обеда SPA, вечером ночной драйв с прожектором.
  stay: <b>Ночь.</b> Royal Zambezi Lodge.
