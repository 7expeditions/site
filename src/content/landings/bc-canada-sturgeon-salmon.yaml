  <meta property="og:type" content="website">
  <meta property="og:title" content="Осётр и лосось — Британская Колумбия | 7 Expeditions">
  <meta property="og:description" content="Белый осётр реки Фрейзер и лосось Тихого океана у Тофино за одну неделю.">
  <meta property="og:url" content="https://7expeditions.com/expeditions/bc-canada-sturgeon-salmon/">
